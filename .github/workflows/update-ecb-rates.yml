name: Update ECB EUR-CNY exchange rate

on:
  schedule:
    - cron: '20 16,18 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-ecb-rates.yml'
      - 'scripts/update_ecb.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get ECB reference data
        run: python scripts/update_ecb.py
      - name: Commit data only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ecb-rates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update ECB exchange rates'
            git push
          fi
